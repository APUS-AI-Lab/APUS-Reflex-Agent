# Compaction recall and System3 memory scoring over the Web surface, with a scripted model and a local Jev gateway.
- id: agent-default-model
  config:
    provider: recall-mock
    model: recall-mock

- insert:
    - id: history-recall-mock-llm
      name: '../../../packages/session-query/tool-history-recall/tests/fixtures/mock-llm.ts'

    - id: jev
      name: '@deepseek-ai/dsh-experimental-apus-dsh-jev-plugin'
      config:
        endpoint: !!js process.env.MEMORY_E2E_JEV_ENDPOINT
        model: APUS-OpenJev-v1-9B-5949
        timeoutMs: 5000

    - id: system3
      name: '@deepseek-ai/dsh-experimental-system3'
      config:
        privacyMode: controlled
        approvedRemoteIds: [jev]
        approvedRemoteDataClasses: [public]
        jevRouteId: jev
        jevExecutionDomain: network
        memoryScoring:
          mode: active
          yes: 0.5
          no: 0.3
          deadlineMs: 5000
          sessionDataClasses: [public]
          maxCandidates: 8
          maxMessageChars: 400
          maxItems: 5
        memoryRecall:
          mode: active
          yes: 0.7
          no: 0.3
          deadlineMs: 5000
          sessionDataClasses: [public]
          maxCandidates: 15
          maxInputChars: 400
          maxMessageChars: 400

    - id: ui-system3
      name: '@deepseek-ai/dsh-experimental-client-ui-system3'
