# TypeScript SDK snapshot-record patch over `dsh --profile sdk`.

# The fixture corpus must not depend on the developer's personal skill roots.
# Ordinary product launches retain the sdk profile's default skill discovery.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  config:
    thinking: enabled
    reasoningEffort: max

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js "process.env.DSH_SNAPSHOT === undefined ? 'zstd' : 'none'"

- id: tool-subagent
  name: '@deepseek-ai/dsh-tool-subagent'
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    maxDepth: 1

- insert:
    - id: continuum-relevance-fixture
      name: ./relevance-fixture.mjs
    - id: continuum-jev
      name: ../../../packages/experimental/continuum-jev/lib/index.js
      config:
        mode: active
        timeoutMs: 5000
        maxRequestBytes: 32768
        sessionDataClasses: [workspace]
        privacyPolicy:
          mode: controlled
          approvedRemoteIds: [fixture-provider]
          approvedRemoteDataClasses: [workspace]
    - id: continuum-memory
      name: ../../../packages/context/continuum/lib/index.js
      config:
        enabled: true
        mode: active
        admission: explicit
        scopes: [workspace]
        maxCandidates: 8
        maxExcerptBytes: 200
        maxTotalBytes: 2048
