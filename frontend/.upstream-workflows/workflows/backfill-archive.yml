name: Backfill release archive

# One-shot: copy an existing GitHub Release into the ModelScope rollback
# archive (releases/archive/<version>/) and rebuild releases/versions.json,
# so a version published before the versioned-update pipeline landed can be
# offered as a rollback target. Mirrors the archive+index step of `publish`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to backfill (e.g. v0.6.3)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backfill-archive
  cancel-in-progress: false

jobs:
  backfill:
    if: vars.APUS_RELEASE_AUTOMATION == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern '*'
          ls -l release-assets
      - name: Archive to ModelScope and rebuild the version index
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          MODELSCOPE_REPO_ID: alexyaojin/dsh-desktop
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$MODELSCOPE_TOKEN" || { echo "::error::Missing secret MODELSCOPE_TOKEN"; exit 1; }
          python3 -m venv "$RUNNER_TEMP/ms-env"
          "$RUNNER_TEMP/ms-env/bin/pip" install -q modelscope
          "$RUNNER_TEMP/ms-env/bin/python3" <<'PY'
          import json, os, pathlib, subprocess, tempfile, urllib.request
          from modelscope.hub.api import HubApi

          api = HubApi()
          token = os.environ["MODELSCOPE_TOKEN"]
          repo_id = os.environ["MODELSCOPE_REPO_ID"]
          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          src = pathlib.Path("release-assets")

          api.upload_folder(
              repo_id=repo_id,
              folder_path=str(src),
              path_in_repo=f"releases/archive/{version}",
              commit_message=f"Backfill archive {tag}",
              token=token,
          )
          print(f"✅ Archived {src} -> {repo_id}/releases/archive/{version}")

          known = {version}
          try:
              with urllib.request.urlopen(
                  "https://dshdesktop.com/updates/versions.json", timeout=15
              ) as response:
                  for entry in json.load(response).get("versions", []):
                      name = entry.get("version")
                      if isinstance(name, str) and name:
                          known.add(name)
          except Exception as error:
              print(f"⚠️ Could not read existing version index: {error}")

          with tempfile.TemporaryDirectory() as work:
              names_file = pathlib.Path(work) / "names.json"
              index_file = pathlib.Path(work) / "versions.json"
              names_file.write_text(json.dumps(sorted(known)))
              subprocess.run(
                  ["node", "scripts/build-version-index.mjs", str(names_file), str(index_file)],
                  check=True,
              )
              api.upload_file(
                  path_or_fileobj=str(index_file),
                  path_in_repo="releases/versions.json",
                  repo_id=repo_id,
                  commit_message=f"Version index after backfilling {tag}",
                  token=token,
              )
          print("✅ Rebuilt releases/versions.json")
          PY
