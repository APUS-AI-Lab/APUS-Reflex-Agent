name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks tracked checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Scan tracked checkout
        run: |
          set -euo pipefail
          docker run --rm --read-only \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            zricethezav/gitleaks:v8.30.1 \
            dir . --config .gitleaks.toml --redact --no-banner --exit-code 1
