name: APUS Web runtime preview

on:
  push:
    branches:
      - release-web-runtime
      - release-windows-product
  workflow_dispatch:
    inputs:
      tag:
        description: Product version label matching the manifest
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: apus-web-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      DSH_TELEMETRY_DISABLED: '1'
      npm_config_audit: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate native build and product label
        env:
          PRODUCT_TAG: ${{ inputs.tag }}
        run: node --input-type=module -e "import { checkRelease } from './scripts/product-release.mjs'; import { execFileSync } from 'node:child_process'; checkRelease(process.cwd(), process.env.PRODUCT_TAG); if (process.platform !== 'linux' || process.arch !== 'x64') throw new Error('Native Linux x64 required'); if (execFileSync('git', ['rev-parse','HEAD'], { encoding:'utf8' }).trim() !== process.env.GITHUB_SHA) throw new Error('Checkout differs from workflow commit')"
      - name: Install native Linux build tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential musl-tools python3 patch
      - name: Install locked build dependencies
        run: pnpm install --frozen-lockfile
      - name: Install locked runtime assembly tools and bundled Node
        working-directory: frontend
        run: npm ci
      - name: Test source-only archive and launcher guards
        run: node --test scripts/product-web.test.mjs
      - name: Build Harness and browser resources
        run: pnpm run build
      - name: Build and verify all Linux native runtime binaries
        run: |
          pnpm --dir native/system run build:native
          node native/system/scripts/verify-launcher-binary.mjs packages/linux-x64
      - name: Deploy the closed runtime
        run: node frontend/scripts/prepare-system3-runtime.mjs --deploy
      - name: Collect full Web archive and checksums
        run: node scripts/product-web-package.mjs
      - name: Install qualification browser
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Qualify extracted Web archive without external developer tools
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('release/manifest.json')).version")
          node scripts/product-web-smoke.mjs --archive "$PWD/.artifacts/product-release/$version/web-linux-x64/apus-reflex-harness-web-linux-x64.tar.gz" --report-dir "$PWD/.artifacts/product-web-smoke"
      - name: Upload Web archive for review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apus-web-preview-linux-x64-${{ github.run_id }}
          path: .artifacts/product-release/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Upload redacted qualification report and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: apus-web-review-linux-x64-${{ github.run_id }}
          path: .artifacts/product-web-smoke/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
