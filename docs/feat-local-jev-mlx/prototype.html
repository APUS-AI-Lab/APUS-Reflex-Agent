<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="APUS Reflex 本机判断的可点击原型：从首次登录、配置密钥，到一键启用本机判断与各类异常恢复。">
<title>本机判断原型</title>
<style>
:root{
  --bg:#f1f3f5;--win:#fff;--side:#f9fafb;--layer:#fff;--layer2:#f1f3f5;--hover:#ebeef2;
  --ink:#0f1115;--ink-2:#61666b;--ink-3:#81858c;--rule:rgba(0,0,0,.1);--rule-2:rgba(0,0,0,.16);
  --pri:#0f1115;--pri-ink:#fff;--ok:#22c55e;--ok-soft:rgba(34,197,94,.12);--bad:#ec1313;--bad-soft:rgba(236,19,19,.08);
  --warn:#d97706;--warn-soft:rgba(217,119,6,.1);--local:#2563eb;--local-soft:rgba(37,99,235,.1);
  --shadow:0 12px 40px rgba(15,17,21,.14),0 2px 8px rgba(15,17,21,.06);
  --scrim:rgba(15,17,21,.32);
  --r-xs:4px;--r-sm:8px;--r-md:12px;--r-lg:16px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei','Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0c0d;--win:#151517;--side:#1b1b1c;--layer:#232324;--layer2:#2c2c2e;--hover:#353638;
  --ink:#f9fafb;--ink-2:#adb2b8;--ink-3:#979da6;--rule:rgba(255,255,255,.12);--rule-2:rgba(255,255,255,.2);
  --pri:#f9fafb;--pri-ink:#0f1115;--bad:#f25a5a;--bad-soft:rgba(242,90,90,.12);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.12);
  --local:#60a5fa;--local-soft:rgba(96,165,250,.14);--shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);--scrim:rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  --bg:#0c0c0d;--win:#151517;--side:#1b1b1c;--layer:#232324;--layer2:#2c2c2e;--hover:#353638;
  --ink:#f9fafb;--ink-2:#adb2b8;--ink-3:#979da6;--rule:rgba(255,255,255,.12);--rule-2:rgba(255,255,255,.2);
  --pri:#f9fafb;--pri-ink:#0f1115;--bad:#f25a5a;--bad-soft:rgba(242,90,90,.12);--warn:#f59e0b;--warn-soft:rgba(245,158,11,.12);
  --local:#60a5fa;--local-soft:rgba(96,165,250,.14);--shadow:0 12px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3);--scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
b,strong{font-weight:500}

/* scenario bar */
.bar{max-width:1180px;margin:0 auto;padding:16px 16px 10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-size:15px;font-weight:500;margin:0 12px 0 0}
.bar .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chipbtn{border:1px solid var(--rule);background:var(--layer);border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-2);transition:background var(--ease) .15s}
.chipbtn:hover{background:var(--hover)}
.chipbtn[aria-pressed="true"]{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.hint{max-width:1180px;margin:0 auto;padding:0 16px 12px;color:var(--ink-3);font-size:12px}

/* window */
.win{max-width:1180px;height:min(760px,calc(100vh - 120px));min-height:560px;margin:0 auto 24px;background:var(--win);border:1px solid var(--rule);border-radius:var(--r-md);box-shadow:var(--shadow);display:flex;overflow:hidden;position:relative}
.side{width:220px;flex:none;background:var(--side);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:12px 10px}
.lights{display:flex;gap:7px;padding:2px 4px 14px}
.lights i{width:11px;height:11px;border-radius:50%;background:var(--rule-2)}
.brand{font-size:13px;font-weight:500;padding:0 6px 10px}
.newchat{display:flex;align-items:center;gap:8px;border:1px solid var(--rule);background:var(--layer);border-radius:var(--r-sm);padding:7px 10px;margin-bottom:12px}
.sess{padding:6px 10px;border-radius:var(--r-sm);color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess.on{background:var(--hover);color:var(--ink)}
.side .grow{flex:1}
.gear{display:flex;align-items:center;gap:8px;padding:7px 10px;border:0;background:none;border-radius:var(--r-sm);color:var(--ink-2);text-align:left;width:100%}
.gear:hover{background:var(--hover)}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.head{height:48px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--rule)}
.head .t{font-weight:500}
.route{font-size:12px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.msgs{flex:1;overflow-y:auto;padding:24px max(20px,calc(50% - 340px)) 12px}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink-3);gap:6px;text-align:center}
.empty b{color:var(--ink);font-size:18px}
.m{margin:0 0 18px;max-width:680px}
.m.u{margin-left:auto;background:var(--layer2);border-radius:var(--r-md);padding:9px 13px;width:fit-content;max-width:80%}
.m.a p{margin:0 0 6px}
.foot{flex:none;padding:0 max(20px,calc(50% - 340px)) 16px}

/* dock */
.dock{display:flex;align-items:center;gap:8px;min-height:30px;font-size:12px;color:var(--ink-2);padding:0 4px 6px;flex-wrap:wrap}
.dock .sp{flex:1}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink-3);flex:none}
.dot.live{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:11.5px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.local{color:var(--local);border-color:color-mix(in srgb,var(--local) 40%,transparent);background:var(--local-soft)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:var(--ok-soft)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:var(--warn-soft)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:var(--bad-soft)}
.link{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule-2);text-underline-offset:3px}
.link:hover{text-decoration-color:var(--ink)}
.prep{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--rule);background:var(--layer);border-radius:999px;padding:2px 10px 2px 8px;font-size:11.5px;color:var(--ink-2);position:relative}
.prep .mini{width:46px;height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.prep .mini i{display:block;height:100%;background:var(--ink);transition:width .3s var(--ease)}
.evid{border:1px solid var(--rule);border-radius:var(--r-sm);background:var(--layer);padding:10px 12px;margin:0 4px 8px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12px}
.evid dt{color:var(--ink-3)}
.evid dd{margin:0}
.evid .row{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:8px;margin-top:4px;color:var(--ink-2)}

.invite{border:1px solid var(--rule-2);border-radius:var(--r-md);background:var(--layer);padding:14px 16px;margin:0 0 10px;display:flex;gap:14px;align-items:flex-start;animation:rise .25s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.invite .ic{width:30px;height:30px;border-radius:var(--r-sm);background:var(--local-soft);color:var(--local);display:grid;place-items:center;flex:none}
.invite .tx{flex:1;min-width:0}
.invite b{display:block;font-size:14px;margin-bottom:2px}
.invite p{margin:0 0 10px;color:var(--ink-2)}
.invite .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.invite .x{border:0;background:none;color:var(--ink-3);padding:2px 4px;border-radius:var(--r-xs)}
.invite .x:hover{background:var(--hover)}
.notice{display:flex;align-items:center;gap:10px;border:1px solid var(--rule);border-radius:var(--r-sm);padding:8px 12px;margin:0 0 10px;font-size:12.5px;color:var(--ink-2);background:var(--layer)}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 35%,var(--rule));background:var(--warn-soft)}
.notice .sp{flex:1}

.composer{border:1px solid var(--rule-2);border-radius:var(--r-lg);background:var(--layer);padding:10px 10px 10px 14px;display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;border:0;background:none;resize:none;outline:none;font:inherit;color:var(--ink);min-height:22px;max-height:120px;padding:4px 0}
.composer textarea::placeholder{color:var(--ink-3)}
.send{width:30px;height:30px;border-radius:50%;border:0;background:var(--pri);color:var(--pri-ink);display:grid;place-items:center;flex:none}
.send:disabled{opacity:.35;cursor:default}

.btn{border:1px solid var(--rule-2);background:var(--layer);border-radius:var(--r-sm);padding:6px 13px;font-size:12.5px;white-space:nowrap;transition:background .15s var(--ease)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.pri:hover{opacity:.9}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-2)}
.btn.quiet:hover{background:var(--hover)}
.btn:disabled{opacity:.45;cursor:default}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:20;padding:16px;animation:fade .2s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{width:min(440px,100%);background:var(--win);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px}
.modal h2{font-size:17px;font-weight:500;margin:0 0 4px}
.modal .sub{color:var(--ink-2);margin:0 0 16px}
.door{display:flex;gap:12px;align-items:center;border:1px solid var(--rule);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px;background:var(--layer);width:100%;text-align:left}
.door:hover{border-color:var(--rule-2);background:var(--hover)}
.door .tx{flex:1}
.door small{display:block;color:var(--ink-3);font-size:12px}
.field{display:flex;flex-direction:column;gap:6px;margin:4px 0 14px}
.field label{font-size:12px;color:var(--ink-2)}
.field input{border:1px solid var(--rule-2);border-radius:var(--r-sm);background:var(--layer);color:var(--ink);padding:8px 10px;font:inherit;outline:none}
.field input:focus{border-color:var(--ink)}
.field .err{font-size:12px;color:var(--bad)}
.rowend{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}

.settings{width:min(820px,100%);height:min(560px,100%);background:var(--win);border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow);display:flex;overflow:hidden}
.snav{width:170px;flex:none;border-right:1px solid var(--rule);padding:14px 8px;background:var(--side)}
.snav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r-sm);color:var(--ink-2)}
.snav button.on{background:var(--hover);color:var(--ink)}
.sbody{flex:1;overflow-y:auto;padding:20px 24px;position:relative}
.sbody h3{font-size:15px;font-weight:500;margin:0 0 4px}
.sbody .lede{color:var(--ink-2);margin:0 0 14px}
.sclose{position:absolute;top:12px;right:12px}
.card{border:1px solid var(--rule-2);border-radius:var(--r-md);padding:14px 16px;margin-bottom:12px;background:var(--layer)}
.card .hd{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.card .hd b{font-size:13.5px}
.card .hd .sp{flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:8px 0 12px;font-size:12.5px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.progress{height:6px;border-radius:3px;background:var(--rule);overflow:hidden;margin:10px 0 6px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s var(--ease)}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:10px}
.honest{font-size:12px;color:var(--ink-3);margin:8px 0 0}

.toasts{position:absolute;right:16px;top:60px;display:flex;flex-direction:column;gap:8px;z-index:30;max-width:min(360px,calc(100% - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--pri);color:var(--pri-ink);border-radius:var(--r-sm);padding:9px 12px;box-shadow:var(--shadow);font-size:12.5px;animation:rise .2s var(--ease)}
.toast .sp{flex:1}
.toast button{border:0;background:none;color:inherit;opacity:.8;text-decoration:underline;text-underline-offset:3px;padding:0}
.toast button:hover{opacity:1}

.coach{position:absolute;z-index:15;background:var(--pri);color:var(--pri-ink);border-radius:var(--r-sm);padding:9px 12px;font-size:12px;max-width:260px;box-shadow:var(--shadow);animation:rise .2s var(--ease)}
.coach::after{content:'';position:absolute;left:18px;bottom:-5px;width:10px;height:10px;background:var(--pri);transform:rotate(45deg)}
.coach button{border:0;background:none;color:inherit;opacity:.8;text-decoration:underline;padding:0;margin-left:6px}
.menu{position:absolute;bottom:calc(100% + 6px);right:0;min-width:150px;background:var(--win);border:1px solid var(--rule);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:4px;z-index:26}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:6px 10px;border-radius:var(--r-xs);font-size:12.5px;color:var(--ink)}
.menu button:hover{background:var(--hover)}

.log{max-width:1180px;margin:0 auto 32px;padding:0 16px;color:var(--ink-3);font-size:12px}
.log ol{margin:6px 0 0;padding-left:18px}

@media (max-width:760px){
  .side{display:none}
  .win{height:calc(100vh - 140px);min-height:520px}
  .settings{flex-direction:column}
  .snav{width:auto;display:flex;gap:4px;border-right:0;border-bottom:1px solid var(--rule);padding:8px;overflow-x:auto}
  .snav button{width:auto;white-space:nowrap}
  .invite{flex-direction:column}
}
</style>
</head>
<body>
<div class="bar">
  <h1>本机判断 · 可点击原型</h1>
  <div class="grp" id="scenes"></div>
  <div class="grp" style="margin-left:auto">
    <button class="chipbtn" id="theme" type="button">切换主题</button>
  </div>
</div>
<p class="hint" id="hint"></p>

<div class="win" id="win">
  <aside class="side">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="brand">APUS Reflex Harness</div>
    <button class="newchat" type="button" id="newchat">＋ 新对话</button>
    <div class="sess on">修复取消信号的重试循环</div>
    <div class="sess">整理发布说明</div>
    <div class="sess">数据管线的回归测试</div>
    <div class="grow"></div>
    <button class="gear" type="button" id="opensettings">⚙ 设置</button>
  </aside>
  <section class="main">
    <div class="head"><span class="t">修复取消信号的重试循环</span><span class="route">自动调度</span></div>
    <div class="msgs" id="msgs"></div>
    <div class="foot">
      <div id="above"></div>
      <div class="dock" id="dock"></div>
      <div id="evid"></div>
      <div class="composer">
        <textarea id="input" rows="1" placeholder="描述你要做的事，回车发送"></textarea>
        <button class="send" id="send" type="button" aria-label="发送">↑</button>
      </div>
    </div>
  </section>
  <div id="overlay"></div>
  <div class="toasts" id="toasts"></div>
</div>

<div class="log"><b>原型说明</b>：数据与耗时均为模拟（下载 4.5 GB 压缩为约 10 秒；本机判断耗时取 M5 冒烟实测的 0.43 秒）。文案即建议的产品文案，按 locale 字典落地。<ol id="log"></ol></div>

<script>
const $ = (s, r = document) => r.querySelector(s)
const h = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild }
const GB = 4.48, GB_LITE = 2.71

const SCENES = {
  fresh: { label: '新用户 · 未配置模型', hint: '首次登录且没有可用的回答模型：先弹就绪引导，配置密钥（任意 sk- 开头）后就能对话。本机判断邀请要在 20 次判断后才出现，可切到「已在使用」体验' },
  ready: { label: '已在使用 · 邀请出现', hint: '已有可用模型、判断次数已够。发一条消息，本轮结束后输入框上方出现邀请卡，点「一键启用」体验全过程' },
  privacy: { label: '隐私模式拦截', hint: '隐私策略设为「仅本机」，云端判断会被拒。发一条消息，看 dock 上的一键动作' },
  timeout: { label: '云端判断不稳', hint: '云端判断连续超时。发两条消息，第二次超时后 dock 末尾出现「改为本机判断」' },
  offline: { label: '下载中途断网', hint: '点邀请卡的「一键启用」：下载到 62% 时断网，恢复后自动续传' },
  disk: { label: '磁盘不足', hint: '可用空间只有 3.1 GB。点「一键启用」，看按钮如何在点击前说清楚代价并给出精简版' },
  slow: { label: '较慢的 Mac', hint: '点「一键启用」：自检测出判断较慢，不自动启用，交给用户选择' },
  crash: { label: '本机运行中崩溃', hint: '本机判断已启用。发一条消息，模拟推理进程崩溃后的兜底与自动恢复' },
}

let S, shownModal = null, shownInvite = false
function reset(scene) {
  clearTimers()
  S = {
    scene, gen: scene !== 'fresh', msgs: [], deciding: false, decisions: scene === 'fresh' ? 0 : 19,
    local: 'off', progress: 0, paused: false, net: true, invite: false, inviteSnoozed: false,
    timeouts: 0, privacy: scene === 'privacy', diskFree: scene === 'disk' ? 3.1 : 180, lite: false,
    coachDone: false, lastDecision: null, evidOpen: false, menu: false, modal: scene === 'fresh' ? 'ready' : null,
    settingsTab: 'models', unstableOffered: false, crashOnce: scene === 'crash', laterNotice: false,
  }
  if (scene === 'crash') { S.local = 'enabled'; S.coachDone = true }
  if (['offline', 'disk', 'slow'].includes(scene)) S.invite = true
  $('#log').innerHTML = ''
  document.querySelectorAll('#scenes .chipbtn').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.s === scene)))
  $('#hint').textContent = SCENES[scene].hint
  $('#toasts').innerHTML = ''
  document.querySelectorAll('.coach').forEach(c => c.remove())
  render()
}
let timers = []
const later = (fn, ms) => { const id = setTimeout(fn, ms); timers.push(id); return id }
const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id }
function clearTimers() { timers.forEach(id => { clearTimeout(id); clearInterval(id) }); timers = [] }
const log = (t) => $('#log').appendChild(h(`<li>${t}</li>`))

function toast(text, action, onAction, ms = 6000) {
  const el = h(`<div class="toast"><span>${text}</span><span class="sp"></span>${action ? `<button type="button">${action}</button>` : ''}</div>`)
  if (action) el.querySelector('button').onclick = () => { el.remove(); onAction() }
  $('#toasts').appendChild(el)
  later(() => el.remove(), ms)
}

/* ---------- rendering ---------- */
function render() {
  renderMsgs(); renderAbove(); renderDock(); renderEvid(); renderOverlay()
  $('#send').disabled = S.deciding
}
function renderMsgs() {
  const box = $('#msgs')
  if (!S.msgs.length) {
    box.innerHTML = `<div class="empty"><b>有什么要做的？</b><span>${S.gen ? '描述任务，APUS Reflex 会先判断用哪个模型和哪些专业指令' : '还没有可用的回答模型'}</span></div>`
    return
  }
  box.innerHTML = S.msgs.map(m => m.role === 'u'
    ? `<div class="m u">${m.text}</div>`
    : `<div class="m a">${m.text.split('\n').map(p => `<p>${p}</p>`).join('')}</div>`).join('')
  box.scrollTop = box.scrollHeight
}
function renderAbove() {
  const box = $('#above'); box.innerHTML = ''
  if (!S.gen && S.laterNotice) {

/* ---------- flows ---------- */
function oneClick(from) {
  if (S.local === 'ready-off') { log(`${from}：模型已下载，直接启用`); S.invite = false; if (S.lastDecision?.action) S.lastDecision.action = null; enable('一键启用'); return }
  if (S.local !== 'off') return
  const need = S.lite ? GB_LITE : GB
  if (S.diskFree < need + 1) { log(`${from}：磁盘不够，按钮在点击前就说明需要的空间`); render(); return }
  S.invite = false; S.local = 'downloading'; S.progress = 0; S.paused = false; S.evidOpen = false
  if (S.lastDecision?.action) S.lastDecision.action = null
  log(`${from}：点一次「一键启用」。邀请卡收起成 dock 右侧的进度标签，对话不受影响`)
  render()
  const tick = every(() => {
    if (S.local !== 'downloading') { clearInterval(tick); return }
    if (S.paused || !S.net) return
    S.progress = Math.min(1, S.progress + 0.02)
    if (S.scene === 'offline' && S.progress >= 0.62 && !S._dropped) {
      S._dropped = true; S.net = false; log('62% 时断网：不报错、不清空，标签显示「网络中断，恢复后自动继续」')

    }
    if (S.progress >= 1) { clearInterval(tick); verify() }
    render()
  }, 200)
}

  S.local = 'verifying'; log('下载完成，sha256 校验通过，自动开始自检（黄金样例 + 测速）'); render()

}

function send() {
  const v = $('#input').value.trim()
  if (!v || S.deciding) return
  if (!S.gen) { S.laterNotice = true; toast('还没有可用的回答模型', '去配置', () => { S.modal = 'key'; render() }); render(); return }
  $('#input').value = ''
  S.msgs.push({ role: 'u', text: v }); S.deciding = true; S.lastDecision = null; S.evidOpen = false
  render()
  const local = S.local === 'enabled'
  let outcome
  if (local && S.crashOnce) {
    S.crashOnce = false
    outcome = { where: 'none', text: '本机判断未完成，本轮按默认处理', route: 'Flash（默认规则）', delay: 600 }
    later(() => { toast('本机判断进程已自动重启'); log('推理进程崩溃：本轮退回默认规则，不改走云端；下次判断前自动重启，连续失败才停用'); }, 900)
  } else if (local) outcome = { where: 'local', text: '已判断：Flash', route: 'Flash', ms: 430, delay: 430 }
  else if (S.privacy) outcome = { where: 'none', text: '隐私设置不允许云端判断，本轮按默认处理', route: 'Flash（默认规则）', delay: 300,
    action: { label: '在本机判断', fn: () => oneClick('隐私拦截') } }

    if (S.timeouts >= 2 && !S.unstableOffered && S.local === 'off') { S.unstableOffered = true; outcome.action = { label: '改为本机判断', fn: () => oneClick('云端不稳') } }
  } else outcome = { where: 'cloud', text: '已判断：Flash', route: 'Flash', ms: 820 + Math.round(Math.random() * 400), delay: 900 }
  later(() => {

      S.msgs.push({ role: 'a', text: '在 retry 循环里，AbortError 被当成普通错误重试了。\n建议在 catch 里先判断 signal.aborted，命中就直接抛出，并补一个回归测试覆盖取消路径。' })

$('#theme').onclick = () => {
  const r = document.documentElement
  const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
  r.dataset.theme = dark ? 'light' : 'dark'
}
reset('fresh')
</script>
</body>
</html>
