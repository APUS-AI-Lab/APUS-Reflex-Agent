<text class="copy" x="928" y="875">限定材料、工具范围与输出</text>
<text class="copy" x="928" y="898">原生委派；父子结果与取消可追溯</text>
<rect x="60" y="1007" width="1150" height="109" rx="8" fill="#0f172a"/>
<rect x="60" y="1007" width="1150" height="109" rx="8" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="label" x="78" y="1037">实际采用与结果驱动的任务反馈</text>
<text class="copy" x="78" y="1063">模型建议、Host 采用、材料真正进入请求、产物校验和当前运行状态分别展示。</text>
<text class="copy" x="78" y="1086">约束恢复不等于执行恢复；Goal active / disarmed 等待明确继续。</text>
<text class="small" x="40" y="1171">实线：当前职责或基础调用；蓝色虚线：目标接入。图内所有新消费者必须独立完成真实采用、回放与效果验收。</text>
<text class="small" x="40" y="1204">本机 Lead ≠ Jev 决策模型；Schedule 需要 Host 运行，不保证 exactly-once，外部通知与跨会话任务另行验收。</text>
<text class="title" x="40" y="45">目标设计：即时判断穿透同一任务</text>
<text class="small" x="40" y="74">本图是目标组合；绿色为现有执行职责，蓝色虚线为尚待贯通的产品能力。</text>
