<rect x="910" y="673" width="295" height="96" rx="8" fill="#0f172a"/>
<rect x="910" y="673" width="295" height="96" rx="8" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 5"/>
