<text class="copy" x="993" y="518">受限配置目录</text>
<text class="copy" x="993" y="541">runtime.env / 0600</text>
<text class="copy" x="993" y="564">工具子进程已验证不携带 Key</text>
<rect x="60" y="704" width="1150" height="99" rx="8" fill="#0f172a"/>
<rect x="60" y="704" width="1150" height="99" rx="8" fill="#34d399" fill-opacity=".08" stroke="#34d399" stroke-width="1.5"/>
<text class="label" x="78" y="734">发布、恢复与前端装配各有验收范围</text>
<text class="copy" x="78" y="760">current 与 service.unit 配对；健康通过后更新 previous；成功回滚消费目标，重复回滚拒绝。</text>
<text class="copy" x="78" y="783">已验证同一源码双 release、会话与产物恢复。签名 / 公证、跨端同步与任意旧源码降级均未验收。</text>
<text class="small" x="40" y="845">隧道断线退出不等于服务器停止；Desktop 关闭后不能据此承诺本机后台继续执行。</text>
