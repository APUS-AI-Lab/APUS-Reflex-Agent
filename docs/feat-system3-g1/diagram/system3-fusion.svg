<rect x="625" y="887" width="585" height="150" rx="8" fill="#60a5fa" fill-opacity=".08" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 5"/>
<text class="label" x="643" y="917">N=10 · 1 主 + 9 子（协作示意）</text>
<text class="copy" x="643" y="943">每实例复用同一机制，拥有独立 Session 与生命周期</text>
<text class="copy" x="643" y="966">父任务经原生 subagent 分配、取消、接收证据、整合</text>
<text class="copy" x="643" y="989">并发上限、全局预算、恢复与真实成果另行验收</text>
<text class="copy" x="643" y="1012">外部专家内部循环属于其 runtime，不计作原生 AgentLoop</text>
<text class="small" x="40" y="1085">N 表示协作中的原生 AgentLoop 实例总数（包含主实例）；不是一份共享可写 Session，也不是循环执行次数。</text>
<text class="small" x="40" y="1117">入口与过程共用有界判断 / 原生采用机制，触发点不同；Jev 建议、模型生成、原生执行各有责任。</text>
<text class="small" x="40" y="1149">当前实测仅入口与 Skill；过程控制和多 Agent 效果需逐节点与规则基线对照，不把 N=10 图示当部署证据。</text>
<text class="title" x="40" y="45">Jev × 推理模型 × Harness：AgentLoop × N</text>
<text class="small" x="40" y="74">同一执行单元，N 改变协作规模而非决策与执行语义；N=10 是目标示意，非当前并发验收。</text>
