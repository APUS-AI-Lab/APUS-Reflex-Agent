<title id="system3-fusion-title">Jev × 推理模型 × Harness：AgentLoop × N</title><desc id="system3-fusion-desc">同一执行单元，N 改变协作规模而非决策与执行语义；N=10 是目标示意，非当前并发验收。</desc>
