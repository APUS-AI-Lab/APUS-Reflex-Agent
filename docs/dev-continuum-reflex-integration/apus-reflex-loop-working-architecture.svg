<text x="414" y="852" fill="#4f5d75" font-size="13" font-weight="400">按配置启用的增强 / 条件反馈</text>
<path d="M764 847 H804" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#apus-loop-link)"/>
<text x="816" y="852" fill="#4f5d75" font-size="13" font-weight="400">发送给生成模型的上下文</text>
<text x="48" y="885" fill="#4f5d75" font-size="14" font-weight="400">Goal 重启后需显式恢复授权 · 模型窗口和续轮数量有限 · 未启用 System3 时保留通用模型路径</text>
