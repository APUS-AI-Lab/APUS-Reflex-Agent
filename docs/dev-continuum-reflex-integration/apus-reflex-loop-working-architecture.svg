<text x="48" y="49" font-size="34" fill="#242b38" font-weight="650">APUS · 让 Personal Agent 持续推进你的目标</text>
<text x="48" y="84" font-size="21" fill="#5d697c" font-weight="400">自己的模型 + Harness 受控执行 + 持久记忆 = 可继续、可恢复、可检查的 Loop Working</text>
