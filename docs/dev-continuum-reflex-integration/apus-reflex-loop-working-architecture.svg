<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1440" role="img" aria-labelledby="apus-product-title apus-product-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="apus-product-title">APUS · Personal Agent 产品与技术架构</title>
<desc id="apus-product-desc">用户通过客户端向 Harness 提交任务，Harness 调用通用模型并可委派 Codex。可选 Reflex 通过有界决策参与路由、监督、恢复和记忆选择。基础 Session 与 Continuum 增强分别保留事实和记忆，投影为有限上下文，支撑受控的 Loop Working。</desc>
