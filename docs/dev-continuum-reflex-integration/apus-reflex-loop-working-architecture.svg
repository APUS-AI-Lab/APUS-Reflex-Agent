<path d="M208 708 V736 Q208 744 216 744 H812 Q820 744 820 736 V708" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-loop-arrow)"/>
<rect x="286" y="273" width="62" height="22" fill="#f5f5f5"/><text x="290" y="289" fill="#4f5d75" font-size="13" font-weight="400">任务</text>
<rect x="620" y="273" width="64" height="22" fill="#f5f5f5"/><text x="624" y="289" fill="#4f5d75" font-size="13" font-weight="400">模型选择</text>
<rect x="958" y="273" width="62" height="22" fill="#f5f5f5"/><text x="962" y="289" fill="#4f5d75" font-size="13" font-weight="400">工具请求</text>
<rect x="1020" y="137" width="284" height="22" fill="#f5f5f5"/><text x="1024" y="153" fill="#4f5d75" font-size="13" font-weight="400">继续 / 纠偏 / 停止：重新检查条件</text>
<rect x="1184" y="448" width="130" height="22" fill="#f5f5f5"/><text x="1188" y="464" fill="#4f5d75" font-size="13" font-weight="400">结果与证据</text>
<rect x="180" y="448" width="112" height="22" fill="#f5f5f5"/><text x="184" y="464" fill="#4f5d75" font-size="13" font-weight="400">输入事件</text>
<rect x="838" y="448" width="144" height="22" fill="#f5f5f5"/><text x="842" y="464" fill="#4f5d75" font-size="13" font-weight="400">本轮上下文</text>
<rect x="444" y="710" width="234" height="22" fill="#f5f5f5"/><text x="448" y="726" fill="#4f5d75" font-size="13" font-weight="400">默认：Session 历史与恢复</text>
<rect x="570" y="762" width="238" height="22" fill="#f5f5f5"/><text x="574" y="778" fill="#4f5d75" font-size="13" font-weight="400">执行结果与回执写回 Session</text>
<rect x="48" y="228" width="232" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="68" y="262" fill="#2d3142" font-size="21" font-weight="650">用户目标与约束</text><text x="68" y="287" fill="#4f5d75" font-size="12" font-weight="500">PERSONAL INTENT</text><text x="68" y="317" fill="#4f5d75" font-size="14" font-weight="400">目标、完成标准、工作区</text><text x="68" y="340" fill="#4f5d75" font-size="14" font-weight="400">用户可以补充、改变或停止</text>
<rect x="352" y="228" width="264" height="152" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="372" y="262" fill="#2d3142" font-size="21" font-weight="650">决策与续轮控制</text><text x="372" y="287" fill="#4f5d75" font-size="12" font-weight="500">DECIDE &amp; CONTINUE</text><text x="372" y="317" fill="#4f5d75" font-size="14" font-weight="400">Goal revision · 续轮上限</text><text x="372" y="340" fill="#4f5d75" font-size="14" font-weight="400">可选 Reflex 建议 + 确定规则</text><text x="372" y="363" fill="#4f5d75" font-size="14" font-weight="400">采纳前校验，不增加权限</text>
<rect x="688" y="228" width="264" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="708" y="262" fill="#2d3142" font-size="21" font-weight="650">通用生成模型</text><text x="708" y="287" fill="#4f5d75" font-size="12" font-weight="500">REASON &amp; REQUEST</text><text x="708" y="317" fill="#4f5d75" font-size="14" font-weight="400">自选 provider / model</text><text x="708" y="340" fill="#4f5d75" font-size="14" font-weight="400">规划、生成、提出工具请求</text>
<rect x="1024" y="228" width="288" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="1044" y="262" fill="#2d3142" font-size="21" font-weight="650">Harness 受控执行</text><text x="1044" y="287" fill="#4f5d75" font-size="12" font-weight="500">TOOLS · SKILLS · SUBAGENTS</text><text x="1044" y="317" fill="#4f5d75" font-size="14" font-weight="400">权限、审批、取消、生命周期</text><text x="1044" y="340" fill="#4f5d75" font-size="14" font-weight="400">执行请求，产生结果与产物</text>
<rect x="48" y="556" width="232" height="152" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="68" y="590" fill="#2d3142" font-size="21" font-weight="650">Session 事实记录</text><text x="68" y="615" fill="#4f5d75" font-size="12" font-weight="500">DURABLE SOURCE EVENTS</text><text x="68" y="645" fill="#4f5d75" font-size="14" font-weight="400">输入、结果、决策回执</text><text x="68" y="668" fill="#4f5d75" font-size="14" font-weight="400">成功 flush 后可恢复</text>
<rect x="352" y="556" width="264" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5" stroke-dasharray="6 4"/><text x="372" y="590" fill="#2d3142" font-size="21" font-weight="650">Continuum 持久记忆</text><text x="372" y="615" fill="#4f5d75" font-size="12" font-weight="500">REFLEX-ONLY AUGMENTATION</text><text x="372" y="645" fill="#4f5d75" font-size="14" font-weight="400">记录 + sourceRefs · 派生索引</text><text x="372" y="668" fill="#4f5d75" font-size="14" font-weight="400">同 Session · 需启用与准入</text>
<rect x="688" y="556" width="264" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="708" y="590" fill="#2d3142" font-size="21" font-weight="650">有限上下文投影</text><text x="708" y="615" fill="#4f5d75" font-size="12" font-weight="500">CONTEXT FOR THIS REQUEST</text><text x="708" y="645" fill="#4f5d75" font-size="14" font-weight="400">选择相关片段，带来源注入</text><text x="708" y="668" fill="#4f5d75" font-size="14" font-weight="400">可选：前缀保护、内容恢复</text>
<rect x="1024" y="556" width="288" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="1044" y="590" fill="#2d3142" font-size="21" font-weight="650">结果与监督反馈</text><text x="1044" y="615" fill="#4f5d75" font-size="12" font-weight="500">VERIFY &amp; INSPECT</text><text x="1044" y="645" fill="#4f5d75" font-size="14" font-weight="400">区分建议、采纳、实际结果</text><text x="1044" y="668" fill="#4f5d75" font-size="14" font-weight="400">未完成时再决定下一步</text>
