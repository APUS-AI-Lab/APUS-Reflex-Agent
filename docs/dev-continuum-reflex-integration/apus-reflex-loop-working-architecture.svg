<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 904" role="img" aria-labelledby="apus-loop-title apus-loop-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="apus-loop-title">APUS Personal Agent · Loop Working</title>
<desc id="apus-loop-desc">用户目标通过决策与续轮控制、通用模型、受控执行和结果反馈持续推进；Session记录事实，可选Continuum记忆按需补充有限上下文。</desc>
