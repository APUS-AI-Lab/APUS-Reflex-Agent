<rect width="1360" height="904" fill="#f5f5f5"/>
<text x="48" y="54" fill="#2d3142" font-size="32" font-weight="650">APUS · The Personal Agent working loop</text>
<text x="48" y="89" fill="#4f5d75" font-size="18" font-weight="400">你的模型做判断，Harness 把工作变成可以继续、检查和恢复的过程。</text>
