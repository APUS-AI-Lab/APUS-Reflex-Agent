<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 688" role="img" aria-labelledby="apus-memory-en-title apus-memory-en-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="apus-memory-en-title">APUS Continuum · Durable facts, bounded context</title>
<desc id="apus-memory-en-desc">Committed source events pass admission into persistent records with source references. A derived index retrieves candidates; optional Reflex selection supplies bounded model context. Recovery replays records within the same Session.</desc>
<defs><marker id="apus-memory-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="apus-memory-en-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="apus-memory-en-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<rect width="1360" height="688" fill="#f5f5f5"/>
<text x="40" y="52" fill="#2d3142" font-size="31" font-weight="650">Continuum · Durable facts, bounded context</text>
<text x="40" y="87" fill="#4f5d75" font-size="17" font-weight="400">Mount Reflex and enable Continuum; configure its selector separately. Durable recovery requires a successful flush.</text>
<path d="M256 396 H308" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-en-arrow)"/>
<path d="M524 396 H576" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-en-arrow)"/>
<path d="M792 396 H844" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-en-arrow)"/>
<path d="M1060 396 H1112" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-en-arrow)"/>
<path d="M952 320 V248" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-en-accent)"/>
<path d="M1060 188 H1212 Q1220 188 1220 196 V320" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-en-accent)"/>
<rect x="976" y="266" width="116" height="22" fill="#f5f5f5"/><text x="980" y="282" fill="#4f5d75" font-size="13" font-weight="400">IDs and excerpts</text>
<rect x="1116" y="153" width="188" height="22" fill="#f5f5f5"/><text x="1120" y="169" fill="#4f5d75" font-size="12" font-weight="400">Validate before adoption</text>
<rect x="40" y="320" width="216" height="152" rx="8" fill="#e9ecf1" stroke="#cbd0d8" stroke-width="1.5"/><text x="60" y="354" fill="#2d3142" font-size="18" font-weight="650">Session events</text><text x="60" y="379" fill="#4f5d75" font-size="12" font-weight="500">SOURCE OF TRUTH</text><text x="60" y="409" fill="#4f5d75" font-size="14" font-weight="400">Committed Session events</text><text x="60" y="432" fill="#4f5d75" font-size="14" font-weight="400">Text, results, file references</text>
<rect x="308" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="328" y="354" fill="#2d3142" font-size="18" font-weight="650">Memory admission</text><text x="328" y="379" fill="#4f5d75" font-size="12" font-weight="500">ADMISSION</text><text x="328" y="409" fill="#4f5d75" font-size="14" font-weight="400">Default: explicit admission</text><text x="328" y="432" fill="#4f5d75" font-size="14" font-weight="400">Opt-in: user text admission</text>
<rect x="576" y="320" width="216" height="152" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="596" y="354" fill="#2d3142" font-size="18" font-weight="650">Persistent records</text><text x="596" y="379" fill="#4f5d75" font-size="12" font-weight="500">REPLAYABLE RECORDS</text><text x="596" y="409" fill="#4f5d75" font-size="14" font-weight="400">Content + sourceRefs</text><text x="596" y="432" fill="#4f5d75" font-size="14" font-weight="400">Replayable change events</text>
<rect x="844" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="864" y="354" fill="#2d3142" font-size="18" font-weight="650">Index and retrieval</text><text x="864" y="379" fill="#4f5d75" font-size="12" font-weight="500">RETRIEVAL</text><text x="864" y="409" fill="#4f5d75" font-size="14" font-weight="400">Scope + active + lexical</text><text x="864" y="432" fill="#4f5d75" font-size="14" font-weight="400">Candidate and byte limits</text>
<rect x="1112" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="1132" y="354" fill="#2d3142" font-size="18" font-weight="650">Request context</text><text x="1132" y="379" fill="#4f5d75" font-size="12" font-weight="500">PROJECTION</text><text x="1132" y="409" fill="#4f5d75" font-size="14" font-weight="400">Excerpts with source refs</text><text x="1132" y="432" fill="#4f5d75" font-size="14" font-weight="400">Traceable model input</text>
<rect x="844" y="128" width="216" height="120" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="864" y="162" fill="#2d3142" font-size="18" font-weight="650">Reflex / Jev selection</text><text x="864" y="187" fill="#4f5d75" font-size="12" font-weight="500">OPTIONAL SELECTOR</text><text x="864" y="217" fill="#4f5d75" font-size="14" font-weight="400">off / shadow / active</text>
<path d="M40 516 H1328" stroke="#cbd0d8"/>
<text x="40" y="552" fill="#2d3142" font-size="15" font-weight="650">Recovery</text>
<text x="180" y="552" fill="#4f5d75" font-size="15" font-weight="400">Same Session → replay memory events → rebuild the index → retrieve again. New Sessions do not share these records by default.</text>
<text x="40" y="588" fill="#2d3142" font-size="15" font-weight="650">Limits</text>
<text x="180" y="588" fill="#4f5d75" font-size="15" font-weight="400">Automatic admission extracts text, not attachments. Summary trees / zoom are explicit helpers, outside default retrieval.</text>
<path d="M40 634 H80" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-en-arrow)"/>
<text x="92" y="639" fill="#4f5d75" font-size="13" font-weight="400">Baseline with Continuum enabled</text>
<path d="M468 634 H508" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-en-accent)"/>
<text x="520" y="639" fill="#4f5d75" font-size="13" font-weight="400">Optional advice; does not control admission</text>
<text x="40" y="674" fill="#4f5d75" font-size="14" font-weight="400">Retained source records can be read again; bounded retrieval, summaries and projection do not guarantee complete recall.</text>
</svg>
