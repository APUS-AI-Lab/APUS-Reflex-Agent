<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 688" role="img" aria-labelledby="apus-memory-title apus-memory-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="apus-memory-title">APUS Continuum · Durable facts, bounded context</title>
<desc id="apus-memory-desc">已提交源事件经准入生成带来源引用的记忆记录，派生索引检索候选，可选Reflex选择后形成有限的模型可见上下文；重启恢复同一Session的记录。</desc>
<defs><marker id="apus-memory-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#4f5d75"/></marker><marker id="apus-memory-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#eb6c36"/></marker><marker id="apus-memory-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6Z" fill="#2e5aa8"/></marker></defs>
<rect width="1360" height="688" fill="#f5f5f5"/>
<text x="40" y="52" fill="#2d3142" font-size="31" font-weight="650">Continuum · Durable facts, bounded context</text>
<text x="40" y="87" fill="#4f5d75" font-size="18" font-weight="400">需挂载 Reflex 并启用 Continuum；记忆选择器另行配置。持久恢复以成功 flush 为准。</text>
<path d="M256 396 H308" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-arrow)"/>
<path d="M524 396 H576" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-arrow)"/>
<path d="M792 396 H844" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-arrow)"/>
<path d="M1060 396 H1112" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-arrow)"/>
<path d="M952 320 V248" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-accent)"/>
<path d="M1060 188 H1212 Q1220 188 1220 196 V320" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-accent)"/>
<rect x="976" y="266" width="116" height="22" fill="#f5f5f5"/><text x="980" y="282" fill="#4f5d75" font-size="13" font-weight="400">候选 ID 与片段</text>
<rect x="1116" y="153" width="188" height="22" fill="#f5f5f5"/><text x="1120" y="169" fill="#4f5d75" font-size="13" font-weight="400">建议经校验后采纳</text>
<rect x="40" y="320" width="216" height="152" rx="8" fill="#e9ecf1" stroke="#cbd0d8" stroke-width="1.5"/><text x="60" y="354" fill="#2d3142" font-size="21" font-weight="650">原始 Session 事件</text><text x="60" y="379" fill="#4f5d75" font-size="12" font-weight="500">SOURCE OF TRUTH</text><text x="60" y="409" fill="#4f5d75" font-size="14" font-weight="400">已提交的 Session 事件</text><text x="60" y="432" fill="#4f5d75" font-size="14" font-weight="400">文本、结果与附件引用</text>
<rect x="308" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="328" y="354" fill="#2d3142" font-size="21" font-weight="650">记忆准入策略</text><text x="328" y="379" fill="#4f5d75" font-size="12" font-weight="500">ADMISSION</text><text x="328" y="409" fill="#4f5d75" font-size="14" font-weight="400">默认：显式提交</text><text x="328" y="432" fill="#4f5d75" font-size="14" font-weight="400">可选：自动准入人类文本</text>
<rect x="576" y="320" width="216" height="152" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="596" y="354" fill="#2d3142" font-size="21" font-weight="650">持久记忆记录</text><text x="596" y="379" fill="#4f5d75" font-size="12" font-weight="500">REPLAYABLE RECORDS</text><text x="596" y="409" fill="#4f5d75" font-size="14" font-weight="400">内容 + sourceRefs</text><text x="596" y="432" fill="#4f5d75" font-size="14" font-weight="400">变更以事件记录，可回放</text>
<rect x="844" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="864" y="354" fill="#2d3142" font-size="21" font-weight="650">派生索引与检索</text><text x="864" y="379" fill="#4f5d75" font-size="12" font-weight="500">RETRIEVAL</text><text x="864" y="409" fill="#4f5d75" font-size="14" font-weight="400">scope、active 与词法候选</text><text x="864" y="432" fill="#4f5d75" font-size="14" font-weight="400">数量与片段字节预算</text>
<rect x="1112" y="320" width="216" height="152" rx="8" fill="#ffffff" stroke="#cbd0d8" stroke-width="1.5"/><text x="1132" y="354" fill="#2d3142" font-size="21" font-weight="650">当前请求上下文</text><text x="1132" y="379" fill="#4f5d75" font-size="12" font-weight="500">PROJECTION</text><text x="1132" y="409" fill="#4f5d75" font-size="14" font-weight="400">取相关片段，保留来源</text><text x="1132" y="432" fill="#4f5d75" font-size="14" font-weight="400">模型可见输入可以追溯</text>
<rect x="844" y="128" width="216" height="120" rx="8" fill="#fff0e7" stroke="#eb6c36" stroke-width="1.5"/><text x="864" y="162" fill="#2d3142" font-size="21" font-weight="650">Reflex / Jev 选择</text><text x="864" y="187" fill="#4f5d75" font-size="12" font-weight="500">OPTIONAL SELECTOR</text><text x="864" y="217" fill="#4f5d75" font-size="14" font-weight="400">off / shadow / active</text>
<path d="M40 516 H1328" stroke="#cbd0d8"/>
<text x="40" y="552" fill="#2d3142" font-size="15" font-weight="650">恢复路径</text>
<text x="180" y="552" fill="#4f5d75" font-size="15" font-weight="400">同一 Session → replay 记忆事件 → 重建索引 → 重新检索；新 Session 不默认共享这些记录。</text>
<text x="40" y="588" fill="#2d3142" font-size="15" font-weight="650">实现边界</text>
<text x="180" y="588" fill="#4f5d75" font-size="15" font-weight="400">自动准入会整理文本；附件不是自动记忆。摘要树 / zoom 是显式 helper，未接入默认检索。</text>
<path d="M40 634 H80" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#apus-memory-arrow)"/>
<text x="92" y="639" fill="#4f5d75" font-size="13" font-weight="400">已启用 Continuum 后的基本路径</text>
<path d="M468 634 H508" fill="none" stroke="#eb6c36" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#apus-memory-accent)"/>
<text x="520" y="639" fill="#4f5d75" font-size="13" font-weight="400">可选决策建议；不决定输入准入</text>
<text x="40" y="674" fill="#4f5d75" font-size="14" font-weight="400">保留源记录支持再次读取；有限检索、摘要与投影不能保证每次完整召回。</text>
</svg>
