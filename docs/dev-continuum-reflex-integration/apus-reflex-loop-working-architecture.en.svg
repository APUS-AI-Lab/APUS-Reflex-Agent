<text x="446" y="820" font-size="15" fill="#c56a15" font-weight="600">REFLEX · OPTIONAL DECISIONS</text>
<text x="446" y="858" font-size="26" fill="#242b38" font-weight="650">Reflex · Instant decisions for the next step</text>
<rect x="446" y="885" width="167" height="42" rx="5" fill="white" stroke="#aeb7c5" stroke-width="1.6"/>
<text x="529.5" y="913" font-size="19" fill="#242b38" font-weight="400" text-anchor="middle">Model routing</text>
