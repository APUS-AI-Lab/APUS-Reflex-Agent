<text x="728.5" y="913" font-size="19" fill="#242b38" font-weight="400" text-anchor="middle">Codex supervision</text>
<rect x="844" y="885" width="166" height="42" rx="5" fill="white" stroke="#aeb7c5" stroke-width="1.6"/>
<text x="927.0" y="913" font-size="19" fill="#242b38" font-weight="400" text-anchor="middle">Context recovery</text>
<rect x="1026" y="885" width="176" height="42" rx="5" fill="white" stroke="#aeb7c5" stroke-width="1.6"/>
<text x="1114.0" y="913" font-size="19" fill="#242b38" font-weight="400" text-anchor="middle">Memory selection</text>
<text x="446" y="962" font-size="17" fill="#5d697c" font-weight="400">Bounded choices · Confidence / abstention · Reject stale results · No new permissions</text>
<text x="446" y="991" font-size="17" fill="#5d697c" font-weight="400">Enable each capability separately; Codex supervision uses evidence from runs under a Goal.</text>
<rect x="420" y="1130" width="810" height="160" rx="8" fill="white" stroke="#5d697c" stroke-width="1.6"/>
<text x="446" y="1160" font-size="15" fill="#5d697c" font-weight="600">CONTEXT · FOR THIS REQUEST</text>
<text x="446" y="1198" font-size="26" fill="#242b38" font-weight="650">Bounded context · Bring history into the current task</text>
<text x="446" y="1232" font-size="20" fill="#5d697c" font-weight="400">Relevant excerpts + current task → bounded model input with source references.</text>
<text x="446" y="1266" font-size="16" fill="#5d697c" font-weight="400">Optional prefix protection and recovery; stored history can grow, while model windows stay finite.</text>
