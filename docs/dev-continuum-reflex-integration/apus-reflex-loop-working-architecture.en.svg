<text x="1078.0" y="535" font-size="19" fill="#242b38" font-weight="400" text-anchor="middle">Sessions · Lifecycle</text>
<text x="446" y="589" font-size="21" fill="#242b38" font-weight="550">Loop Working: goal → act → inspect → continue / correct / stop</text>
<text x="446" y="617" font-size="17" fill="#5d697c" font-weight="400">General models run independently; Reflex advises at configured extension points.</text>
