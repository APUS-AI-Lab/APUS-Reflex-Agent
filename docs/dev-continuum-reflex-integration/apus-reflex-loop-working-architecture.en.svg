<text x="1351" y="701" font-size="15" fill="#5d697c" font-weight="400">Results and evidence to Harness</text>
<rect x="1330" y="810" width="302" height="195" rx="8" fill="#f5f6f8" stroke="#aeb7c5" stroke-width="1.6"/>
