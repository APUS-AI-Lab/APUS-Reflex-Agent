<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1440" role="img" aria-labelledby="apus-product-en-title apus-product-en-desc" style="font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif">
<title id="apus-product-en-title">APUS · Product and technical architecture</title>
<desc id="apus-product-en-desc">Users submit tasks to the Harness, which calls general models and can delegate to Codex. Optional Reflex decisions support routing, supervision, recovery and memory selection. Session history and Continuum memory project bounded context for controlled Loop Working.</desc>
