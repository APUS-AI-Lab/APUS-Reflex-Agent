<p class="hint">横向滑动可查看完整技术架构。</p>
<figcaption>
<p><strong>读图：</strong>入口选路发生在符合条件的空闲 Session API 文本准入阶段；执行期间通过原生扩展点进行 Skill 选择、任务要求处理、过程监督及可选完成核验。Jev 提供判断，所属服务决定采纳方式；推理模型仍负责实际规划和工具调用。</p>
<p><strong>范围：</strong>N 包含主 Agent 与原生子 Agent 实例，各自拥有 Session 和生命周期；外部 Codex 的内部循环不计为 DSH 原生 AgentLoop。System3 的各项能力需要显式配置。委派首先注入建议，主模型可以不采纳；规则监督和日志折叠不调用 Jev。</p>
<p><strong>记录：</strong>Session 图元合并展示原生日志及 System3 投影；决策由各拥有者记录，图中写入箭头汇总执行链路。回放投影不重新请求 Jev。当前图不把入口和 Skill 决策误画成统一经过 decision-kernel；共享 kernel 主要用于任务卡与完成核验。</p>
</figcaption>
</figure>
