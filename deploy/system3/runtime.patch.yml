# SSH forwards this host-loopback socket; native browser authentication remains enabled.
- id: webserver
  config:
    host: 127.0.0.1
    port: 18731
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
- id: session-log-deepseek
  config:
    enabled: false
# System3 visitors arrive from the public site; the Harness developer testing notice would block their first input on every load.
- id: ui-settings-models
  config:
    welcomeNotice: false
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      # Official DeepSeek API: DeepSeek-V4.1-Flash serves `deepseek-flash` (1M context, vision) and DeepSeek-V4-Pro-0813
      # serves `deepseek-v4-pro` (1M context, text only); both think on request.
      # The window matches the other tiers so entry routing can switch between them and compaction stays aligned.
      deepseek-official:
        displayName: DeepSeek 官方
        api: openai-completions
        baseURL: https://api.deepseek.com
        apiKeyEnv: DEEPSEEK_API_KEY
        compat:
          thinkingFormat: deepseek
        models:
          - id: deepseek-flash
            contextWindow: 131072
            maxTokens: 8192
            input: [text, image]
            reasoningEfforts: {off: null, low: low, medium: medium, high: high}
          - id: deepseek-v4-pro
            contextWindow: 131072
            maxTokens: 8192
            input: [text]
            reasoningEfforts: {off: null, low: low, medium: medium, high: high}
      fidoo:
        displayName: Fidoo LiteLLM
        api: openai-completions
        baseURL: https://proxy.fidoo.ai/v1
        apiKeyEnv: SYSTEM3_LITELLM_API_KEY
        compat:
          thinkingFormat: deepseek
        models:
          - id: deepseek-v4-flash
            contextWindow: 131072
            maxTokens: 8192
            input: [text, image]
            reasoningEfforts: {off: null, low: low, medium: medium, high: high}
          - id: deepseek-v4-pro
            contextWindow: 131072
            maxTokens: 8192
            input: [text]
            reasoningEfforts: {off: null, low: low, medium: medium, high: high}
      fidoo-relay:
        displayName: Fidoo LiteLLM relay
        api: openai-completions
        baseURL: https://proxy.fidoo.ai/v1
        apiKeyEnv: SYSTEM3_LITELLM_API_KEY
        models:
          - id: gpt-5.6-sol-relay
            contextWindow: 131072
            maxTokens: 8192
            input: [text, image]
            reasoningEfforts: {low: low, medium: medium, high: high}
          - id: gpt-6-sol-relay
            contextWindow: 131072
            maxTokens: 8192
            input: [text, image]
            reasoningEfforts: {low: low, medium: medium, high: high}
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
    reasoningEffort: low
- insert:
    - id: ui-system3
      name: ../../packages/experimental/client-ui-system3/lib/index.js
    - id: jev
      name: ../../packages/experimental/apus-dsh-jev-plugin/lib/index.js
      config:
        endpoint: https://owb1q1vidflfhp-8086.proxy.runpod.net
        model: APUS-OpenJev-v1-9B-5949
        apiKeyEnv: JEV_API_KEY
        effort: high
        timeoutMs: 15000
        keepAliveMs: 120000
        http2: true
        # Two decisions without a response on the shared HTTP/2 connection reopen it.
        resetAfterFailures: 2
    - id: system3
      name: ../../packages/experimental/system3/lib/index.js
      config:
        privacyMode: controlled
        observeAgentLoop: true
        approvedRemoteIds: [jev, fast, reasoning, expert, frontier, codex]
        approvedRemoteDataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
        jevRouteId: jev
        jevExecutionDomain: network
        jevEffort: high
        delegationProgress:
          intervalMs: 2000
          monitor:
            overtimeMs: 360000
            stallMs: 180000
            startupMs: 120000
        processSupervision:
          mode: advise
          repeatedError: 2
          failedAttempts: 3
          stalledSteps: 6
          delegateFailures: 3
          editTools: [write, edit]
          delegationTools: [subagent_codex]
          shellTools: [bash]
          progressTools: [web_search, web_fetch]
          verifyPattern: '\b(pytest|unittest|vitest|jest|go test|cargo (test|build)|(npm|pnpm|yarn)( run)? (test|build|typecheck)|tsc|make (test|check|build))\b'
          failurePattern: '\bFAILED\b|\b[1-9][0-9]* (failed|errors?)\b|No module named|No such file or directory|Permission denied|command not found|Traceback \(most recent call last\)|npm ERR!|\bfatal: |exit code:? [1-9]'
        outputFolding:
          mode: active
          shellTools: [bash]
          commandPattern: '\b(pytest|unittest|vitest|jest|mocha|go test|cargo (test|build)|(npm|pnpm|yarn|bun)( run)? (test|build|typecheck)|tsc|make (test|check|build))\b'
          minLines: 6
          minChars: 200
          minNetChars: 300
          minNetShare: 0.1
        taskFrame:
          mode: active
          yes: 0.5
          no: 0.3
          deadlineMs: 8000
          sessionDataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
          maxItems: 8
          maxMessageChars: 600
          interjection: active
        completionReview:
          mode: shadow
          yes: 0.5
          no: 0.3
          deadlineMs: 15000
          sessionDataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
          maxRefusals: 2
          evidenceCalls: 20
          resultChars: 300
        skillSelection:
          sessionDataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
          minConfidence: 0.5
          maxInputBytes: 16000
          maxContentBytes: 24000
          deadlineMs: 8000
          maxCandidates: 32
        entryRouting:
          deadlineMs: 15000
          baseline:
            executionDomain: network
            dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
          sessionDataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
          minConfidence: 0.8
          maxInputBytes: 16384
          retainOnAbstain: true
          keepWarm:
            windowMs: 300000
            intervalMs: 2000
          # Avoid only clearly broken lines: on prd the relay first token is about 26 s and every route streams 100+ tok/s.
          routeHealth:
            window: 20
            sampleTtlMs: 1800000
            minSamples: 3
            maxFirstTokenMs: 45000
            minTokensPerSecond: 10
            minOutputTokens: 200
            maxErrorRate: 0.5
            probe:
              idleMs: 1800000
              maxTokens: 64
          # Real Jev on the hand-off e2e: requirements scored 0.41-0.997, other messages at most 0.06.
          handoffPack:
            recentMessages: 12
            maxMessageChars: 500
            minProbability: 0.3
            deadlineMs: 5000
          candidates:
            - id: fast
              description: 简短问答、翻译、改写、归纳，以及范围明确、一步就能完成的常规任务。
              label: 简单问答 · DeepSeek V4.1 Flash
              provider: deepseek-official
              model: deepseek-flash
              reasoningEffort: low
              executionDomain: network
              dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
            - id: reasoning
              description: 需要几步推理的分析：解释原理、比较方案、阅读和排查一段代码、中等规模的计算或推导。
              label: 推理分析 · DeepSeek V4 Pro
              provider: deepseek-official
              model: deepseek-v4-pro
              reasoningEffort: low
              executionDomain: network
              dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
            - id: expert
              description: 约束多、跨度大的专业任务：完整系统设计、跨模块代码改造、长篇材料综合，以及需要权衡依赖与风险的方案。
              label: 复杂专业任务 · GPT-5.6 Sol
              provider: fidoo-relay
              model: gpt-5.6-sol-relay
              reasoningEffort: medium
              executionDomain: network
              dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
            - id: frontier
              description: 最难的一类问题：开放式研究、严格证明、前沿难题，以及前几档模型很可能无法可靠完成的任务。
              label: 前沿难题 · GPT-6 Sol
              provider: fidoo-relay
              model: gpt-6-sol-relay
              reasoningEffort: high
              executionDomain: network
              dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
            - id: codex
              description: 超出一次对话能完成的大型工程任务：在大型代码库里长时间探索、跨十个以上文件改造、反复构建和测试直到通过，通常要十分钟以上。几分钟内能直接改完的修复、函数实现或单个功能都不属于此类，交给模型直接完成。
              label: 工程任务 · 委派 Codex
              delegate:
                provider: codex
                tool: subagent_codex
              explicitPatterns:
                - '(交给|让|用|委派给?)\s*codex'
                - 'subagent_codex'
                - 'delegate (this |it )?to codex'
              executionDomain: network
              dataClasses: !!js 'JSON.parse(process.env.SYSTEM3_SESSION_DATA_CLASSES || "null")'
    # Delegation target: Codex with the private home release.sh installs, calling the Fidoo relay.
    - id: subagent-codex
      name: ../../packages/subagent/subagent-codex/lib/index.js
      config:
        permissionMode: never
        env:
          CODEX_HOME: !!js process.env.SYSTEM3_CODEX_HOME
          SYSTEM3_LITELLM_API_KEY: !!js process.env.SYSTEM3_LITELLM_API_KEY
    - id: tool-subagent-codex-system3
      name: ../../packages/subagent/tool-subagent/lib/index.js
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        # Foreground only: the System3 progress card and Stop act on the delegating turn, which a background job outlives.
        enableRunInBackground: false
        maxDepth: provider-managed
