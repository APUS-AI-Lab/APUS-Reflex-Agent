# system3.xdan.work — xDAN System3 Harness (Cloudflare DNS only; certbot HTTP-01).
# The Harness listens on loopback only; nginx terminates TLS and adds Basic Auth in front of
# the Harness launch-token cookie. The access log omits query strings so launch tokens never land on disk.

log_format system3_noargs '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name system3.xdan.work;
    access_log /var/log/nginx/system3.access.log system3_noargs;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; default_type text/plain; }
    location / { return 301 https://$host$uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name system3.xdan.work;

    ssl_certificate     /etc/letsencrypt/live/system3.xdan.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/system3.xdan.work/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    access_log /var/log/nginx/system3.access.log system3_noargs;
    client_max_body_size 50m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "xDAN System3";
    auth_basic_user_file /etc/nginx/htpasswd/system3.xdan.work;

    location ^~ /.well-known/acme-challenge/ { auth_basic off; root /var/www/html; default_type text/plain; }

    location / {
        proxy_pass http://127.0.0.1:18731;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Basic Auth credential is for nginx only.
        proxy_set_header Authorization "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
