# Public OpenAI Responses example, installed only for a new service Codex home.
# For another provider, replace this file with your own literal provider URL/model.
# TOML values do not interpolate shell environment variables; env_key names the credential.
model = "gpt-5.4"
model_provider = "openai-api"
approval_policy = "never"
sandbox_mode = "workspace-write"
check_for_update_on_startup = false

[model_providers.openai-api]
name = "OpenAI API"
base_url = "https://api.openai.com/v1"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[analytics]
enabled = false
