# Live-only patch over the shipped headless profile: DeepSeek's official API generates, the deployed APUS Reflex (Jev)
# endpoint judges, and a declared 24K window forces compaction so scoring and per-turn recall run on real models.
# Credentials come only from DEEPSEEK_API_KEY and APUS_JEV_API_KEY in the environment.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    models:
      - id: deepseek-flash
        name: DeepSeek-V41-Flash (24K live window)
        contextWindow: 24576
        maxTokens: 4096
        inputModalities: [text, image]
        systemPromptUpdate: in-history
        toolUpdate: addition-only

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-flash
        cwd: !!js process.cwd()

- id: compaction-basic
  config:
    recallFooter: true
    headroomTokens: 2048
    thresholdRatio: 0.7
    retainRatio: 0.2

- insert:
    - id: tool-history-recall
      name: '../../../../../session-query/tool-history-recall/src/index.ts'

    - id: jev
      name: '../../../../apus-dsh-jev-plugin/src/index.ts'
      config:
        endpoint: https://ac2n5m38jjciqg-8086.proxy.runpod.net
        model: APUS-OpenJev-v1-9B-5949
        effort: low
        timeoutMs: 15000
        apiKeyEnv: APUS_JEV_API_KEY

    - id: system3
      name: '../../../src/index.ts'
      config:
        privacyMode: controlled
        approvedRemoteIds: [jev]
        approvedRemoteDataClasses: [public]
        jevRouteId: jev
        jevExecutionDomain: network
        jevEffort: low
        memoryScoring:
          mode: active
          yes: 0.5
          no: 0.3
          deadlineMs: 15000
          sessionDataClasses: [public]
          maxCandidates: 8
          maxMessageChars: 400
          maxItems: 5
        memoryRecall:
          mode: active
          yes: 0.7
          no: 0.3
          deadlineMs: 5000
          sessionDataClasses: [public]
          maxCandidates: 15
          maxInputChars: 400
          maxMessageChars: 400
