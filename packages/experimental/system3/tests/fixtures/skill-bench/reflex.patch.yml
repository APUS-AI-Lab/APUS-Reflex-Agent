# Live-only patch: the native setup plus Reflex (Jev) Skill pre-selection with the shipped product thresholds.
# Credentials come only from DEEPSEEK_API_KEY and JEV_API_KEY; the endpoint and model come from JEV_ENDPOINT and JEV_MODEL.
- id: headless-startup
  disabled: true

- id: headless-runner
  disabled: true

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY

- id: agent-loop
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-flash
        cwd: !!js process.cwd()

- insert:
    - id: jev
      name: '../../../../apus-dsh-jev-plugin/src/index.ts'
      config:
        endpoint: !!js process.env.JEV_ENDPOINT
        model: !!js process.env.JEV_MODEL
        apiKeyEnv: JEV_API_KEY
        timeoutMs: 15000

    - id: system3
      name: '../../../src/index.ts'
      config:
        privacyMode: controlled
        approvedRemoteIds: [jev]
        approvedRemoteDataClasses: [workspace]
        jevRouteId: jev
        jevExecutionDomain: network
        skillSelection:
          sessionDataClasses: [workspace]
          minConfidence: 0.5
          maxInputBytes: 16000
          maxContentBytes: 12000
          maxCandidates: 15
          deadlineMs: 3000
